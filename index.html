<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Store</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 6px;
    font-family: Arial, sans-serif;
    background: #8caf78;
    color: white;
}

.grid {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
}

.product {
    height: 36px;

    display: flex;
    align-items: center;
    gap: 6px;

    padding: 4px 6px;

    background: rgba(67, 111, 55, 0.38);

    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 7px;

    color: white;
    font-size: 13px;

    cursor: pointer;
    overflow: hidden;
}

.product img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    border-radius: 5px;
    flex-shrink: 0;
}

.product-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.product:active {
    transform: scale(0.97);
    background: rgba(60,100,50,0.6);
}

.product img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    flex-shrink: 0;
}

.product-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>

</head>

<body>

const grid = document.getElementById("productGrid");


products.forEach(product => {

    const item = document.createElement("div");

    item.className = "product";

    item.innerHTML = `
        <img src="${product.icon}">
        <div class="product-name">
            ${product.name} (${product.stock})
        </div>
    `;


    item.onclick = () => {

        tg.showPopup({

            title: product.name,

            message:
            "Số lượng hiện có: " +
            product.stock,

            buttons: [
                {
                    id: "buy",
                    type: "default",
                    text: "Chọn"
                },

                }
            ]

        });

    grid.appendChild(item);
