<!DOCTYPE html>
<html lang="vi">
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Store</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 6px;
    font-family: Arial, sans-serif;
    background: #8caf78;
    color: white;
}

.grid {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
}

.product {
    height: 36px;

    display: flex;
    align-items: center;
    gap: 6px;

    padding: 4px 6px;

    background: rgba(67, 111, 55, 0.38);

    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 7px;

    color: white;
    font-size: 13px;

    cursor: pointer;
    overflow: hidden;
}

.product img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    border-radius: 5px;
    flex-shrink: 0;
}

.product-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.product:active {
    transform: scale(0.97);
    background: rgba(60,100,50,0.6);
}

.product img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    flex-shrink: 0;
}

.product-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>

</head>

<body>

<div class="grid" id="productGrid"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

/* =========================
   KẾT NỐI SUPABASE
========================= */

const SUPABASE_URL = "https://xkepazqrzfjvgkijnfrv.supabase.co";

const SUPABASE_KEY = "sb_publishable_iWGggP4RFF-MeZA9EaY_WA_u47nCBUg";

const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ICON CỦA SẢN PHẨM
========================= */

const icons = {
    chatgpt: "icons/chatgpt.png",
    spotify: "icons/spotify.png",
    netflix: "icons/netflix.png"
};


/* =========================
   ĐỊNH DẠNG TIỀN
========================= */

function formatMoney(amount) {
    return new Intl.NumberFormat("vi-VN").format(amount) + "đ";
}


/* =========================
   LẤY SẢN PHẨM TỪ SUPABASE
========================= */

async function loadProducts() {

    const grid = document.getElementById("productGrid");

    grid.innerHTML = `
        <div style="padding:15px;">
            Đang tải sản phẩm...
        </div>
    `;

    const { data, error } = await sb.rpc(
        "get_store_products"
    );

    if (error) {

        console.error(error);

        grid.innerHTML = `
            <div style="padding:15px;">
                Không tải được sản phẩm.
            </div>
        `;

        return;
    }

    grid.innerHTML = "";


    data.forEach(product => {

        const item = document.createElement("div");

        item.className = "product";


        const icon =
            icons[product.slug] ||
            "https://www.google.com/s2/favicons?domain=google.com&sz=128";


        item.innerHTML = `
            <img src="${icon}">
            
            <div class="product-name">
                ${product.name} (${product.stock})
            </div>
        `;


        item.onclick = () => {

            tg.showPopup({

                title: product.name,

                message:
                    "Giá: " +
                    formatMoney(product.price) +
                    "\n\nSố lượng còn: " +
                    product.stock,

                buttons: [
                    {
                        id: "buy",
                        type: "default",
                        text: "Mua"
                    },

                    {
                        type: "cancel"
                    }
                ]

            });

        };


        grid.appendChild(item);

    });

}


/* =========================
   CHẠY KHI MỞ MINI APP
========================= */

loadProducts();

</script>

</body>
</html>
